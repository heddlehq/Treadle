name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: scripts/check_version.sh

      - name: Check the formatting
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test ./...
