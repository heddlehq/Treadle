name: Release

# Builds the archives behind the install scripts. A `v*` tag publishes them to its
# GitHub release. Anything else only builds and smoke tests them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "VERSION"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: startsWith(github.ref, 'refs/tags/v')
        name: Check the tag against VERSION
        run: scripts/check_version.sh "$GITHUB_REF_NAME"

      - if: startsWith(github.ref, 'refs/tags/v')
        name: Only release what is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - if: "!startsWith(github.ref, 'refs/tags/v')"
        run: scripts/check_version.sh

  package:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: macos-arm64, runner: macos-15 }
          - { target: windows-x64, runner: windows-2022 }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: scripts/package_release.sh ${{ matrix.target }}

      - run: scripts/smoke_release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: treadle-${{ matrix.target }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: cp scripts/install.sh scripts/install.ps1 dist/

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber
